<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Map">
  <!-- A compass rose in the map's bronze on its ink background. Drawn rather
       than exported so it stays crisp at 16px and carries no raster weight. -->
  <rect width="32" height="32" rx="6" fill="#0c0a08"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#5c4524" stroke-width="1"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#3a3228" stroke-width="1"/>
  <!-- North point filled, south hollow: the standard way a rose reads at a glance. -->
  <path d="M16 4.5 L19 16 L16 13.5 Z" fill="#c4a574"/>
  <path d="M16 27.5 L13 16 L16 18.5 Z" fill="#c4a574"/>
  <path d="M16 4.5 L13 16 L16 13.5 Z" fill="#8a6a3d"/>
  <path d="M16 27.5 L19 16 L16 18.5 Z" fill="#8a6a3d"/>
  <path d="M4.5 16 H12 M20 16 H27.5" stroke="#8a6a3d" stroke-width="1.25" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="1.6" fill="#e8dcc8"/>
</svg>
